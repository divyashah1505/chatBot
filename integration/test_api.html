<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatBot API Integration Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      width: 100%;
      max-width: 650px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h1 { font-size: 20px; margin-bottom: 8px; color: #38bdf8; }
    p.sub { font-size: 13px; color: #94a3b8; margin-bottom: 16px; }
    .status-bar {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border: 1px solid #334155;
    }
    .badge {
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge.online { background: #166534; color: #4ade80; }
    .badge.offline { background: #991b1b; color: #f87171; }
    #chat-box {
      height: 380px;
      overflow-y: auto;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      background: #2563eb;
      color: white;
    }
    .msg.bot {
      align-self: flex-start;
      background: #334155;
      color: #f1f5f9;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      background: #0f172a;
      border: 1px solid #475569;
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }
    input[type="text"]:focus {
      border-color: #38bdf8;
    }
    button {
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0369a1; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="card">
    <h1>ChatBot REST API Test Page</h1>
    <p class="sub">Calls your local FastAPI backend at <code>http://localhost:8000/api/chat</code></p>

    <div class="status-bar">
      <span>API Status:</span>
      <span id="api-status" class="badge offline">Checking...</span>
    </div>

    <div id="chat-box">
      <div class="msg bot">Hello! Ask me any question, query candidates, or verify prescriptions.</div>
    </div>

    <form class="input-row" id="chat-form">
      <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off" />
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>

  <script type="module">
    import { ChatbotClient } from './chatbot-api.js';

    const bot = new ChatbotClient({ apiUrl: 'http://localhost:8000' });
    const statusEl = document.getElementById('api-status');
    const chatBox = document.getElementById('chat-box');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    // Check health on load
    async function checkBackend() {
      const ok = await bot.checkHealth();
      if (ok) {
        statusEl.textContent = 'Online (Port 8000)';
        statusEl.className = 'badge online';
      } else {
        statusEl.textContent = 'Backend Offline (Run: python main.py)';
        statusEl.className = 'badge offline';
      }
    }
    checkBackend();
    setInterval(checkBackend, 5000);

    function appendMessage(text, sender) {
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      msg.textContent = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msg;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      userInput.value = '';
      sendBtn.disabled = true;

      const loadingMsg = appendMessage('Typing...', 'bot');

      try {
        const response = await bot.sendMessage(text);
        loadingMsg.textContent = response.reply;
      } catch (err) {
        loadingMsg.textContent = `Error: Could not reach backend at http://localhost:8000. Make sure backend is running (python main.py). Details: ${err.message}`;
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    });
  </script>
</body>
</html>
