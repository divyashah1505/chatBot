<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>External Website - Chatbot Integration Demo</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .demo-card {
      max-width: 600px;
      background: #1e293b;
      padding: 32px;
      border-radius: 16px;
      border: 1px solid #334155;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 { color: #38bdf8; margin-bottom: 12px; font-size: 26px; }
    p { color: #94a3b8; line-height: 1.6; margin-bottom: 20px; }
    .status {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: #064e3b;
      color: #34d399;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>

  <div class="demo-card">
    <div class="status">● Sample Host Website</div>
    <h1>Your Website Content Here</h1>
    <p>
      This represents any external website (HTML, WordPress, React, Next.js, Shopify, etc.).
      Notice the floating AI Chatbot launcher button at the bottom-right corner!
    </p>
    <p>Click the chat bubble in the bottom right to open the chatbot.</p>
  </div>

  <!-- ============================================================= -->
  <!-- 🚀 COPY-PASTE CHATBOT WIDGET SNIPPET (Add to any website)     -->
  <!-- ============================================================= -->
  <style>
    #ai-chatbot-widget-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 999999;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #ai-chatbot-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      box-shadow: 0 8px 24px rgba(14, 165, 233, 0.4);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
    }

    #ai-chatbot-btn:hover {
      transform: scale(1.08) translateY(-2px);
      box-shadow: 0 12px 28px rgba(14, 165, 233, 0.5);
    }

    #ai-chatbot-btn svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
      transition: transform 0.3s ease;
    }

    #ai-chatbot-modal {
      display: none;
      position: fixed;
      bottom: 96px;
      right: 24px;
      width: 420px;
      height: 650px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 120px);
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      flex-direction: column;
      z-index: 999999;
      animation: chatbotFadeIn 0.25s ease-out forwards;
    }

    @keyframes chatbotFadeIn {
      from { opacity: 0; transform: translateY(16px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    #ai-chatbot-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }

    @media (max-width: 480px) {
      #ai-chatbot-modal {
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100vw;
        height: 100vh;
        max-width: 100vw;
        max-height: 100vh;
        border-radius: 0;
      }
      #ai-chatbot-widget-container {
        bottom: 16px;
        right: 16px;
      }
    }
  </style>

  <div id="ai-chatbot-widget-container">
    <button id="ai-chatbot-btn" aria-label="Open AI Assistant">
      <!-- Chat Bubble Icon -->
      <svg id="ai-chat-icon" viewBox="0 0 24 24">
        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
      </svg>
    </button>
  </div>

  <div id="ai-chatbot-modal">
    <!-- REPLACE THIS URL with your actual Vercel deployment URL -->
    <iframe 
      id="ai-chatbot-iframe" 
      src="https://your-chatbot-frontend.vercel.app" 
      title="AI Chatbot Assistant"
      allow="microphone; clipboard-write">
    </iframe>
  </div>

  <script>
    (function() {
      const btn = document.getElementById("ai-chatbot-btn");
      const modal = document.getElementById("ai-chatbot-modal");
      let isOpen = false;

      btn.addEventListener("click", () => {
        isOpen = !isOpen;
        if (isOpen) {
          modal.style.display = "flex";
          btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>`;
        } else {
          modal.style.display = "none";
          btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>`;
        }
      });
    })();
  </script>
  <!-- ============================================================= -->

</body>
</html>
